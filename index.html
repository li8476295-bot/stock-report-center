<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股票报表中心</title>
<style>
 :root{--bg:#0f1420;--card:rgba(24,31,49,.9);--card-soft:rgba(26,34,51,.94);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.18);--accent:#c792ea;--accent2:#4fc3f7;--gold:#f1c40f;--up:#ff5b5b;--down:#2ecc71;--text:#e8eaf0;--muted:#9aa4bd;--radius:12px;--shadow:0 6px 24px rgba(0,0,0,.3);--brand:#4d6bfe;--brand2:#c792ea;--brand3:#4fc3f7}
 *{box-sizing:border-box}
 html{-webkit-text-size-adjust:100%}
 body{background:var(--bg);color:var(--text);font-family:'Microsoft YaHei',system-ui,-apple-system,sans-serif;margin:0;padding:16px;max-width:1100px;margin-left:auto;margin-right:auto;position:relative;line-height:1.5}
 body::before{content:'';position:fixed;inset:0;background:url('static-bg.jpg') no-repeat center/cover;z-index:-2}
 @media (min-resolution:2dppx){body::before{background:url('static-bg@2x.jpg') no-repeat center/cover}}
 body::after{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(20,14,34,.30),rgba(24,18,40,.22));z-index:-1}
 h1{font-size:22px;margin:8px 0;font-weight:800;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5);letter-spacing:.5px}
 @supports ((-webkit-background-clip:text) or (background-clip:text)){
  h1{background:linear-gradient(90deg,#8ec5ff,#c792ea 55%,#ff9ff3);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 10px rgba(79,195,247,.45))}
 }
 h2{font-size:15px;color:#f0e6fa;border-left:3px solid var(--brand);padding-left:10px;margin:26px 0 10px;background:linear-gradient(90deg,rgba(77,107,254,.18),rgba(199,146,234,.06),rgba(199,146,234,0));padding:6px 10px;border-radius:0 8px 8px 0;letter-spacing:.5px}
 table{width:100%;border-collapse:collapse;background:var(--card-soft);font-size:13px}
 .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;margin-top:6px;box-shadow:var(--shadow);border:1px solid var(--line)}
 th,td{padding:6px 9px;text-align:left;border-bottom:1px solid rgba(38,48,74,.9);white-space:nowrap}
 th{background:linear-gradient(180deg,rgba(77,107,254,.30),rgba(60,59,88,.96));color:#dcd2f0;font-size:12px;position:sticky;top:0;letter-spacing:.3px}
 tbody tr{transition:background .12s}
 tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
 tbody tr:hover{background:rgba(216,130,190,.18)}
 tbody tr:hover td{color:#fff}
 tbody tr:last-child td{border-bottom:0}
 td:first-child{font-weight:600;color:#dfe6f5}
 td.up,td.down,th.up,th.down{font-variant-numeric:tabular-nums}
 td b,td span.tag{font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,rgba(40,50,80,.66),rgba(24,31,49,.9));border:1px solid var(--line);border-top:1px solid rgba(255,255,255,.14);border-radius:var(--radius);padding:12px 14px;margin:10px 0;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.review{background:var(--card-soft)}
.core-card{border:1px solid rgba(241,196,15,.45);background:rgba(31,26,14,.92)}
.up{color:var(--up)}.down{color:var(--down)}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;display:inline-block}
.tag-buy{background:var(--down);color:#0f1420}.tag-stop{background:var(--up);color:#fff}
.tag-wait{background:#e67e22;color:#fff}
.note{color:var(--muted);font-size:12px;margin-top:6px}
a{color:#d9a5f0;text-decoration:none;cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.nav{position:sticky;top:0;background:rgba(20,14,36,.92);padding:8px 0;border-bottom:1px solid var(--line-strong);margin-bottom:10px;z-index:100;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--muted);font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:0 0 auto;transition:all .18s}
.nav a:hover{color:#fff;background:linear-gradient(90deg,rgba(77,107,254,.38),rgba(199,146,234,.32));box-shadow:0 2px 12px rgba(77,107,254,.35)}
/* ── DeepSeek娘 桌宠（蓝发鲸鱼女仆 · 自动散步/拖拽/互动）── */
.ds-pet{position:fixed;bottom:10px;z-index:9999;cursor:grab;pointer-events:auto;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.ds-pet:active{cursor:grabbing}
.ds-pet img{width:120px;height:130px;object-fit:contain;filter:drop-shadow(0 6px 22px rgba(79,195,247,.55));animation:petFloat 3.2s ease-in-out infinite}
.ds-pet::after{content:'';position:absolute;left:50%;bottom:-4px;width:72%;height:14px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(79,195,247,.4),transparent 70%);filter:blur(2px)}
.ds-bubble{position:absolute;left:50%;bottom:112%;transform:translateX(-50%);background:rgba(10,16,28,.9);border:1px solid rgba(79,195,247,.55);color:#dff4ff;font-size:12px;padding:5px 11px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:2;max-width:70vw}
.ds-bubble.on{opacity:1}
@keyframes petFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media(max-width:640px){.ds-pet{bottom:8px}.ds-pet img{width:84px;height:91px}}
.detail-insert{background:rgba(26,25,44,.94);border:1px solid var(--line-strong);border-radius:10px;padding:12px;margin:10px 0}
.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.detail-head button{background:#4a4670;color:#e8eaf0;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.chip{display:inline-block;background:#3a3658;color:#c3b8d6;border-radius:14px;padding:5px 12px;margin:3px 6px 3px 0;cursor:pointer;font-size:13px;transition:background .15s}
.chip:hover{background:#b388d6;color:#fff}
.review{background:#1a2233;border-radius:10px;padding:12px;margin:8px 0}
.review h3{font-size:13px;color:var(--muted);margin:0 0 6px}
.review pre{white-space:pre-wrap;word-break:break-all;font-family:'Microsoft YaHei',sans-serif;font-size:13px;margin:0;color:var(--text)}
.pain{border-radius:10px;padding:12px 14px;margin:10px 0;border:1px solid var(--line);box-shadow:var(--shadow)}
.pain-0{background:#12331e;border-color:#2ecc71}
.pain-1{background:#33290f;border-color:#f1c40f}
.pain-2{background:#331414;border-color:#ff5b5b}
.pain-title{font-size:15px;font-weight:bold}
.pain-0 .pain-title{color:#2ecc71}
.pain-1 .pain-title{color:#f1c40f}
.pain-2 .pain-title{color:#ff7b7b}
.pain-body{font-size:13px;color:#c9d2e3;margin-top:4px}
.rate-red{color:#ff5b5b;font-weight:bold}
.rate-org{color:#ff9f43;font-weight:bold}
.rate-yel{color:#f1c40f}
.rate-grn{color:#2ecc71;font-weight:bold}
.core-card h3{color:var(--gold);margin:0 0 8px;font-size:14px}
.core-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.core-item{background:#3a3658;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;min-width:170px}
.core-item .nm{font-weight:bold;color:#fff}
.core-item .st{font-size:11px;color:#c9d2e3;margin-top:3px}
.idx-card{padding:10px 14px}
.idx-title{font-size:13px;color:var(--muted);margin-bottom:6px}
.idx-row{display:flex;gap:14px;flex-wrap:wrap}
.idx-item span{color:var(--muted);font-size:12px;margin-right:8px}
.idx-item b{font-size:17px}
.idx-item small{font-size:12px}
.sec-hot{border-left:4px solid #f39c12;color:#f39c12}
.dist{font-size:11px;color:var(--muted)}
.tag-buy{animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}100%{box-shadow:0 0 0 6px rgba(46,204,113,0)}}
.split-cols{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.split-col{flex:1;min-width:180px;background:#161e31;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
.split-col b{display:block;margin-bottom:6px;color:var(--muted)}
.split-list{max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.split-item{padding:2px 0;border-bottom:1px solid #4a4470}
.ops-card{background:linear-gradient(180deg,rgba(124,111,192,.18),rgba(24,31,49,.9));border:1px solid rgba(160,140,255,.42)}
.ops-note{color:var(--muted);font-size:12px;margin-top:8px}
.chip-on{background:#b388d6;color:#fff}
#kline-chart,#nav-chart{width:100%}
#kline-chart{height:380px}
#nav-chart{height:300px}
@media (min-width:641px){
 .nav{gap:14px}
}
@media (max-width:1024px){ .c-hide-md{display:none} }
@media (max-width:640px){
 body{padding:10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));padding-bottom:max(10px,env(safe-area-inset-bottom))}
 h1{font-size:18px;margin:6px 0}
 h2{font-size:14px;padding:5px 8px}
 .nav a{font-size:13px;padding:7px 12px}
 .review pre{font-size:13px}
 .chip{font-size:13px;padding:8px 14px;margin:4px 6px 4px 0}
 .card{padding:10px 10px}
 .idx-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .idx-item{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
 .idx-item span{display:block;margin:0 0 2px;font-size:12px}
 .idx-item b{font-size:16px}
 .idx-item small{font-size:11px}
 .core-item{flex:1 1 calc(50% - 8px);min-width:0;font-size:12.5px}
 .pain{padding:10px 12px}
 .split-col{flex:1 1 100%;min-width:0}
 #kline-chart{height:240px}
 #nav-chart{height:200px}
 .detail-head button{padding:8px 12px}
 th,td{padding:6px 7px;font-size:13px}
 .c-hide-sm{display:none}
 /* ── 推荐池：表格 → 卡片列表（手机专用）── */
 #sec1 .tblwrap{overflow:visible;border:0;box-shadow:none;background:none}
 #sec1 .tblwrap table{display:block;background:none}
 #sec1 .tblwrap thead{display:none}
 #sec1 .tblwrap tbody{display:block}
 #sec1 .tblwrap tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:10px 12px;margin:0 0 8px;background:var(--card-soft);border:1px solid var(--line);border-radius:10px}
 #sec1 .tblwrap tbody td{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;padding:2px 0;white-space:normal}
 #sec1 .tblwrap tbody td::before{content:attr(data-label);color:var(--muted);font-size:11px;flex:0 0 auto}
 #sec1 .tblwrap tbody td:first-child{grid-column:1/-1;font-weight:bold;font-size:15px}
 #sec1 .tblwrap tbody td:last-child{grid-column:1/-1;justify-content:flex-end;padding-top:4px}
 #sec1 .tblwrap tbody td:first-child::before,#sec1 .tblwrap tbody td:last-child::before{display:none}
 img{max-width:100%;height:auto}
}
</style>
<script src="custom-chart.js"></script>
<script src="wallpaper-engine.js"></script>
<script src="whale-widget.js"></script>
<script src="we-ui.js"></script>
</head>

var GATE = document.getElementById('pwgate');
var VAULT = document.getElementById('vault');
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function deriveKey(pw,salt){
 var enc=new TextEncoder();
 return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(km){
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
 });
}
function render(pt){
 var i=pt.indexOf('<script>');
 var html=i>=0?pt.slice(0,i):pt;
 var js=i>=0?pt.slice(i+8).replace(/<\/script>[\s\S]*$/,''):'';
 VAULT.innerHTML=html;
 if(js){try{(0,eval)(js);}catch(e){console.error('vault js',e);}}
}
function unlock(pw){
 if(!window.crypto||!window.crypto.subtle){alert('当前环境不支持解密（需 HTTPS + 现代浏览器）');return;}
 var p=VAULT_CIPHER.split('.');
 var errEl=document.getElementById('pwerr');
 try{
  deriveKey(pw,b64(p[0])).then(function(key){
   return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p[1])},key,b64(p[2]));
  }).then(function(pt){
   var text=new TextDecoder().decode(pt);
   sessionStorage.setItem('rc_pw',pw);
   GATE.style.display='none';
   render(text);
  }).catch(function(){
   errEl.style.display='';errEl.textContent='密码错误（或页面已过期，请刷新）';
  });
 }catch(e){errEl.style.display='';errEl.textContent='密码错误';}
}
function checkPw(){unlock(document.getElementById('pwin').value);}
(function(){
 if(!window.crypto||!window.crypto.subtle)return;
 var saved=sessionStorage.getItem('rc_pw');
 if(saved){GATE.style.display='none';unlock(saved);}
})();
document.addEventListener('DOMContentLoaded',function(){
 var inp=document.getElementById('pwin');
 inp.addEventListener('keydown',function(e){if(e.key==='Enter')checkPw();});
 document.getElementById('pwbtn').addEventListener('click',function(){checkPw();});
 inp.focus();
});

</script>
